  <style>
    :root {
      /* Light Theme Colors */
      --bg-color: #f0f2f5;
      --text-color: #333;
      --card-bg: #fff;
      --sidebar-bg: linear-gradient(135deg, #2c3e50, #34495e);
      --primary-color: #2980b9;
      --secondary-color: #2c3e50;
      --accent-color: #27ae60;
      --shadow-color: rgba(0,0,0,0.1);
      --menu-hover: rgba(255,255,255,0.15);
    }

    /* Dark Theme Overrides */
    body.dark-mode {
      --bg-color: #1e1e2f;
      --text-color: #f0f0f0;
      --card-bg: #2c2c3c;
      --sidebar-bg: linear-gradient(135deg, #1c1c2b, #2a2a3d);
      --primary-color: #3498db;
      --secondary-color: #2c2c3c;
      --accent-color: #2ecc71;
      --shadow-color: rgba(255,255,255,0.1);
      --menu-hover: rgba(255,255,255,0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      transition: width 0.3s;
      overflow: hidden;
    }
    .sidebar.collapsed {
      width: 80px;
    }

    /* SIDEBAR HEADER */
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .sidebar-header img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      transition: transform 0.3s;
    }
    .sidebar.collapsed .sidebar-header img {
      transform: scale(0.8);
    }
    .sidebar-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      transition: opacity 0.3s;
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar.collapsed .sidebar-header h3 {
      opacity: 0;
    }

    /* NAV MENU */
    .nav-menu {
      display: flex;
      flex-direction: column;
    }
    .nav-menu a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      transition: background 0.2s, padding 0.3s;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-menu a:hover {
      background: var(--menu-hover);
    }
    .nav-menu .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: #fff;
    }
    .sidebar.collapsed .nav-menu a {
      padding: 0.75rem;
      justify-content: center;
    }
    .sidebar.collapsed .nav-menu a span {
      display: none;
    }

    /* MAIN CONTENT WRAPPER */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      background-color: var(--card-bg);
      padding: 1rem 2rem;
      box-shadow: 0 1px 4px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .toggle-sidebar-btn {
      cursor: pointer;
      fill: var(--text-color);
      transition: transform 0.3s;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg-color);
      padding: 0.4rem 1rem;
      border-radius: 24px;
      transition: background-color 0.3s;
    }
    .search-bar input {
      border: none;
      outline: none;
      background: transparent;
      margin-left: 0.5rem;
      color: var(--text-color);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .topbar-right .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
    }
    .topbar-right .icon-btn .icon {
      width: 24px;
      height: 24px;
      fill: var(--text-color);
      transition: fill 0.3s;
    }
    .topbar-right .icon-btn .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e74c3c;
      color: #fff;
      font-size: 0.7rem;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dark-mode-toggle {
      background: var(--bg-color);
      border: none;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 24px;
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    /* DASHBOARD CONTENT */
    .dashboard-content {
      padding: 2rem;
      overflow-y: auto;
      flex: 1;
    }

    /* STAT CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 2px 4px var(--shadow-color);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: background-color 0.3s;
    }
    .stat-card h4 {
      font-size: 0.9rem;
      color: #777;
      font-weight: 400;
    }
    .stat-card .value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-color);
    }

    /* TEACHER / EMPLOYEE INFO CARD */
    .teacher-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 2px 4px var(--shadow-color);
      display: flex;
      align-items: center;
      padding: 1.5rem;
      margin-bottom: 2rem;
      gap: 1.5rem;
      transition: background-color 0.3s;
    }
    .teacher-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--secondary-color);
    }
    .teacher-card .info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .teacher-card .info h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--secondary-color);
    }
    .teacher-card .info span {
      font-size: 0.9rem;
      color: #666;
      transition: color 0.3s;
    }

    /* SECTION HEADER */
    .section-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--secondary-color);
      margin-bottom: 1rem;
    }

    /* COURSE FOLDER GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    /* FOLDER CARD */
    .folder-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 2px 4px var(--shadow-color);
      padding: 1rem;
      transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .folder-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px var(--shadow-color);
    }
    .folder-card h3 {
      font-size: 1rem;
      margin-bottom: 0.2rem;
      font-weight: 600;
      color: var(--secondary-color);
    }
    .folder-card p {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 0.5rem;
      transition: color 0.3s;
    }

    /* PROGRESS BAR (OPTIONAL) */
    .progress-bar {
      background: #e0e0e0;
      height: 6px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: auto; /* push to bottom */
    }
    .progress-bar span {
      display: block;
      height: 100%;
      background-color: var(--accent-color);
      width: 60%; /* Example progress percentage */
      transition: width 0.4s;
    }

    /* RESPONSIVE SIDEBAR & LAYOUT */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        z-index: 999;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0 !important;
      }
      .toggle-sidebar-btn {
        display: block;
      }
    }

    /* SCROLLBAR (optional styling) */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }

    /* NEW STYLES FOR CENTERED HEADER */
    .header-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      text-align: center;
    }
    
    .department-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--secondary-color);
    }
    
    .course-folder {
      font-size: 1rem;
      color: #666;
    }

    /* Adjust topbar-left to not take space unnecessarily */
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .notification-container {
      position: relative;
      display: inline-block;
    }

    .notification-dropdown {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 300px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      z-index: 1000;
      border-radius: 8px;
      padding: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .notification-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .notification-item:hover {
      background-color: #f5f5f5;
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: #ff4444;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 12px;
      display: none;
    }

    .clear-notifications {
      text-align: center;
      padding: 10px;
      color: #666;
      cursor: pointer;
      border-top: 1px solid #eee;
    }

    .clear-notifications:hover {
      color: #ff4444;
    }
  </style>

<script>
function updateNotificationCount() {
    fetch("{% url 'unread_message_count' %}")
        .then(response => response.json())
        .then(data => {
            const badge = document.getElementById("notification-badge");
            if (data.count > 0) {
                badge.style.display = "inline-block";
                badge.innerText = data.count;
            } else {
                badge.style.display = "none";
            }
        })
        .catch(err => console.error("Failed to fetch unread message count", err));
}

// Update every 10 seconds
setInterval(updateNotificationCount, 10000);

// Also call once on page load
updateNotificationCount();
</script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const notifBell = document.getElementById("notif-bell");
    const notifCount = document.getElementById("notif-count");
    const notifDropdown = document.getElementById("notif-dropdown");
    const notifList = document.getElementById("notif-list");
    const clearBtn = document.getElementById("clear-btn");

    let unreadCount = 0;

    // Toggle dropdown
    notifBell.onclick = function () {
        notifDropdown.style.display = notifDropdown.style.display === "block" ? "none" : "block";
    };

    // WebSocket connection
    const socket = new WebSocket('ws://' + window.location.host + '/ws/notifications/');

    socket.onmessage = function (e) {
        const data = JSON.parse(e.data);
        const msg = data.message;

        const newNotif = document.createElement("div");
        newNotif.innerText = msg;
        notifList.prepend(newNotif);

        unreadCount++;
        notifCount.innerText = unreadCount;
        notifCount.style.display = 'inline-block';
    };

    // Clear notifications
    clearBtn.onclick = function () {
        notifList.innerHTML = "";
        unreadCount = 0;
        notifCount.innerText = "0";
        notifCount.style.display = 'none';

        // Optional: send AJAX to mark as read
        fetch('/clear-notifications/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
            }
        });
    };

    // Helper to get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
