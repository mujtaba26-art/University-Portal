{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
{% csrf_token %}
<h2>Chat App</h2>


<!-- With this: -->
{% if users|length > 1 %}
    <label for="user-select">Select User:</label>
    <select id="user-select">
        {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
        {% endfor %}
    </select>
{% else %}
    <input type="hidden" id="user-select" value="{{ users.0.id }}">
{% endif %}

<div id="chat-box" style="height:300px; overflow:auto; border:1px solid black; margin-top:10px;"></div>
<textarea id="message-input" placeholder="Type your message here..."></textarea>
<button onclick="sendMessage()">Send</button>

<script>
let receiver_id = $("#user-select").val();

$("#user-select").change(function () {
    receiver_id = $(this).val();
    loadMessages();
});

function sendMessage() {
    let message = $("#message-input").val();
    $.post("/send/", {
        'receiver_id': receiver_id,
        'content': message,
        'csrfmiddlewaretoken': '{{ csrf_token }}'
    }, function (data) {
        $("#message-input").val('');
        loadMessages();
    });
}

function loadMessages() {
    $.get("/get-messages/", {
        'receiver_id': receiver_id
    }, function (data) {
        let html = '';
        data.messages.forEach(msg => {
            html += `<p><b>${msg.sender}</b>: ${msg.content} <i>(${msg.timestamp})</i></p>`;
        });
        $("#chat-box").html(html);
    });
}

setInterval(loadMessages, 2000); // Auto-refresh
loadMessages();
</script>
</body>
</html>
