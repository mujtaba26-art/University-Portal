
{% extends "base-teacher.html" %}
{% block content %}   
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Add notification badge style */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }
        
        /* ... existing styles ... */
    </style>

    <style>
        #chat-box {
            height: 400px;
            overflow-y: auto;
            border-radius: 10px;
            background-color: #f8f9fa;
            padding: 15px;
            border: 1px solid #dee2e6;
        }
        .chat-message {
            margin-bottom: 10px;
        }
        .chat-message b {
            color: #0d6efd;
        }
        .timestamp {
            font-size: 0.8rem;
            color: gray;
        }
    </style>
</head>
<body class="bg-light">
<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
    <div class="toast hide" role="alert" id="message-notification-toast">
        <div class="toast-header">
            <strong class="me-auto">New Message</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-message-content"></div>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Chat App</h4>
                </div>
                    <div class="position-relative">
                        
                    </div>
                </div>

                <div class="card-body">

                    {% csrf_token %}

                    {% if users|length > 1 %}
                        <div class="mb-3">
                            <label for="user-select" class="form-label">Select User</label>
                            <select id="user-select" class="form-select">
                                {% for user in users %}
                                    <option value="{{ user.id }}">{{ user.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    {% else %}
                        <input type="hidden" id="user-select" value="{{ users.0.id }}">
                    {% endif %}

                    <div id="chat-box" class="mb-3"></div>

                    <div class="input-group">
                        <textarea id="message-input" class="form-control" placeholder="Type your message here..." rows="2"></textarea>
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
<script>
    // WebSocket for message notifications
    const notificationSocket = new WebSocket(
        `ws://${window.location.host}/ws/message-notifications/`
    );

    notificationSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        if (data.type === 'unread_count') {
            updateNotificationBadge(data.count);
            
            // Show toast for new messages
            if (data.count > 0 && data.latest_message) {
                showNewMessageToast(data.latest_message);
            }
        }
    };

    notificationSocket.onclose = function(e) {
        console.error('Message notifications socket closed unexpectedly');
        // Try to reconnect after 3 seconds
        setTimeout(connectNotificationSocket, 3000);
    };

    function connectNotificationSocket() {
        notificationSocket = new WebSocket(
            `ws://${window.location.host}/ws/message-notifications/`
        );
        // Reattach event handlers...
    }

    function updateNotificationBadge(count) {
        const badge = document.getElementById('message-notification-badge');
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
    }

    function showNewMessageToast(message) {
        const toastEl = document.getElementById('message-notification-toast');
        const toastBody = document.getElementById('toast-message-content');
        
        toastBody.textContent = `${message.sender}: ${message.content}`;
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    // ... existing chat functions ...

    // When entering chat - mark messages as read
    function markMessagesAsRead() {
        $.post("/mark-messages-read/", {
            'csrfmiddlewaretoken': '{{ csrf_token }}'
        }, function(data) {
            if(data.status === 'success') {
                updateNotificationBadge(0);
            }
        });
    }

    // Call this when chat is opened
    $(document).ready(function() {
        markMessagesAsRead();
        loadMessages();
        
        // Set up periodic message loading
        setInterval(loadMessages, 2000);
        
        // Re-mark as read when switching users
        $("#user-select").change(function() {
            markMessagesAsRead();
            loadMessages();
        });
    });

    // ... existing sendMessage and loadMessages functions ...
</script>

<script>
    let receiver_id = $("#user-select").val();

    $("#user-select").change(function () {
        receiver_id = $(this).val();
        loadMessages();
    });

    function sendMessage() {
        let message = $("#message-input").val();
        if (!message.trim()) return;
        $.post("/send/", {
            'receiver_id': receiver_id,
            'content': message,
            'csrfmiddlewaretoken': '{{ csrf_token }}'
        }, function (data) {
            $("#message-input").val('');
            loadMessages();
        });
    }

    function loadMessages() {
        $.get("/get-messages/", {
            'receiver_id': receiver_id
        }, function (data) {
            let html = '';
            data.messages.forEach(msg => {
                html += `
                    <div class="chat-message">
                        <b>${msg.sender}</b>: ${msg.content} 
                        <div class="timestamp">(${msg.timestamp})</div>
                    </div>`;
            });
            $("#chat-box").html(html);
            $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
        });
    }

    setInterval(loadMessages, 2000);
    loadMessages();
</script>



{% endblock content %}
